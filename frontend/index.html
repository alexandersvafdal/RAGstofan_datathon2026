<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>RAGstofan</title>
  <script>try { const t = JSON.parse(localStorage.getItem("ragstofan-theme") || "{}");
    if (t.palette === "amber") t.palette = "hagstofan";  // Amber was replaced by Hagstofan
    if (t.palette && t.palette !== "warm") document.documentElement.dataset.palette = t.palette;
    if (t.mode && t.mode !== "auto") document.documentElement.dataset.theme = t.mode; } catch {}</script>
  <link rel="stylesheet" href="style.css?v=27">
  <script src="https://cdn.jsdelivr.net/npm/vega@5.30.0/build/vega.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-lite@5.21.0/build/vega-lite.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-embed@6.26.0/build/vega-embed.min.js"></script>
</head>
<body>
  <header class="nav">
    <a class="brand" href="/" aria-label="RAGstofan home">
      <svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="12" width="4" height="9" rx="2"/><rect x="10" y="7" width="4" height="14" rx="2"/><rect x="17" y="3" width="4" height="18" rx="2"/></svg>
      <svg class="logo-h" viewBox="0 0 12.6 17.45" aria-hidden="true"><path d="M2.295,2.894C1.661,2.679,0.634,2.679,0,2.894v5.403h2.295z"/><path d="M7.419,0.162c-0.634-0.216-1.661-0.216-2.295,0v8.136h2.295z"/><path d="M12.544,9.963c0.081-0.238,0.081-0.623,0-0.86H0v5.403c0.634,0.216,1.661,0.216,2.295,0V9.963h2.829v7.275c0.634,0.216,1.661,0.216,2.295,0V9.963z"/></svg>
      RAGstofan
    </a>
    <div class="nav-right">
      <span id="status" class="status" title="Model and data source">…</span>
      <button id="about-btn" class="theme-btn about-btn" type="button" aria-label="About and limitations">i</button>
      <div class="theme" id="theme">
        <button class="theme-btn" type="button" aria-label="Theme" aria-haspopup="true" aria-expanded="false"><span></span></button>
        <div class="theme-pop" role="dialog" aria-label="Theme">
          <h3 data-i18n="palette">Colour</h3>
          <div class="swatches">
            <button class="swatch" data-palette="warm" style="--sw-bg:#f6f3ee;--sw-accent:#3f6b4d"><i></i>Warm</button>
            <button class="swatch" data-palette="graphite" style="--sw-bg:#f5f5f7;--sw-accent:#3a3a3c"><i></i>Graphite</button>
            <button class="swatch" data-palette="blue" style="--sw-bg:#f5f5f7;--sw-accent:#0071e3"><i></i>Blue</button>
            <button class="swatch" data-palette="navy" style="--sw-bg:#f3f6f8;--sw-accent:#0d4f74"><i></i>Navy</button>
            <button class="swatch" data-palette="glacier" style="--sw-bg:#f2f7f8;--sw-accent:#137c8b"><i></i>Glacier</button>
            <button class="swatch" data-palette="aurora" style="--sw-bg:#f6f4fa;--sw-accent:#5b3fb8"><i></i>Aurora</button>
            <button class="swatch" data-palette="lava" style="--sw-bg:#f7f2ef;--sw-accent:#b4532a"><i></i>Lava</button>
            <button class="swatch" data-palette="hagstofan" style="--sw-bg:#eef8fb;--sw-accent:#285971"><i></i>Hagstofan</button>
          </div>
          <h3 data-i18n="appearance">Appearance</h3>
          <div class="segmented" role="group" aria-label="Appearance">
            <button data-mode="auto" class="on">Auto</button>
            <button data-mode="light">Light</button>
            <button data-mode="dark">Dark</button>
          </div>
        </div>
      </div>
      <div class="segmented" role="group" aria-label="Answer language">
        <button data-lang="auto" class="on">Auto</button>
        <button data-lang="is">IS</button>
        <button data-lang="en">EN</button>
      </div>
    </div>
  </header>

  <section id="home" class="home">
    <div class="hero">
      <p class="eyebrow" data-i18n="eyebrow">Statistics Iceland · Gagnaþon 2026</p>
      <h1 data-i18n="hello">Iceland, in numbers.</h1>
      <p class="lede" data-i18n="sub">Ask anything about Iceland's official statistics. Every answer comes with the figure, its unit and the table it came from.</p>
      <div id="pills" class="pill-field" aria-label="Example questions"></div>
    </div>

    <div class="dash">
      <div class="dash-head">
        <h2 data-i18n="today">The latest numbers</h2>
        <span id="asof" class="asof"></span>
      </div>
      <div id="tiles" class="tiles"></div>
    </div>
  </section>

  <dialog id="about" aria-label="About RAGstofan"></dialog>

  <main id="chat" class="chat" aria-live="polite"></main>

  <form id="ask" class="composer">
    <div class="composer-inner">
      <input id="q" autocomplete="off" placeholder="Ask about Icelandic statistics" aria-label="Question">
      <button type="submit" id="send" aria-label="Ask">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
    </div>
  </form>

  <script src="app.js?v=27"></script>
</body>
</html>
