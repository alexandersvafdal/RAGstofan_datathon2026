<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hagbot</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/vega@5.30.0/build/vega.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-lite@5.21.0/build/vega-lite.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-embed@6.26.0/build/vega-embed.min.js"></script>
</head>
<body>
  <header class="top">
    <div class="brand">Hagbot <span class="muted">· Statistics Iceland data</span></div>
    <div class="controls">
      <span id="status" class="pill muted">…</span>
      <div class="lang" role="group" aria-label="Answer language">
        <button data-lang="auto" class="on">Auto</button>
        <button data-lang="is">IS</button>
        <button data-lang="en">EN</button>
      </div>
    </div>
  </header>

  <main id="chat" aria-live="polite">
    <section class="empty" id="empty">
      <h1 data-i18n="hello">Ask about Iceland in numbers</h1>
      <p class="muted" data-i18n="sub">Answers come with the figure, its unit and the official table it came from.</p>
      <div class="examples">
        <button class="example">How many people live in Reykjavík?</button>
        <button class="example">How much did Reykjavík grow from 2025 to 2026?</button>
        <button class="example">What share of Iceland's people live in Reykjavík?</button>
        <button class="example">How many people live in Iceland, and what is the unemployment rate?</button>
        <button class="example">Hvað búa margir í Reykjavík?</button>
      </div>
    </section>
  </main>

  <form id="ask" class="ask">
    <input id="q" autocomplete="off" placeholder="Ask about Icelandic statistics…" aria-label="Question">
    <button type="submit" id="send">Ask</button>
  </form>

  <template id="tpl-user"><div class="msg user"><div class="bubble"></div></div></template>
  <template id="tpl-bot">
    <div class="msg bot">
      <div class="card">
        <div class="loading"><span class="dot"></span><span class="dot"></span><span class="dot"></span>
          <span class="muted loading-text">Finding the right table…</span></div>
      </div>
    </div>
  </template>

  <script src="app.js"></script>
</body>
</html>
