# The static demo on GitHub Pages: the web app (frontend/) answering from saved real answers (frontend/demo/,
# recorded with scripts/record_demo.py). No server, no model: frontend/demo.js stands in for the /api calls.
name: Demo on GitHub Pages

on:
  push:
    branches: [main]
    paths: ["frontend/**", "scripts/build_demo_site.py", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the demo site
        run: python3 scripts/build_demo_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
