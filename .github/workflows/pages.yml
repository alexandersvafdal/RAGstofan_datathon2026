# The static demo on GitHub Pages: the web app (frontend/) answering from saved real answers (frontend/demo/,
# recorded with scripts/record_demo.py). No server, no model: frontend/demo.js stands in for the /api calls.
name: Demo on GitHub Pages

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the demo site
        run: |
          mkdir _site
          cp -r frontend/. _site/
          # demo.js goes in before app.js; links to "/" stay inside the project's Pages folder
          sed -i 's|<script src="app.js|<script src="demo.js?v=1"></script>\n  <script src="app.js|; s|href="/"|href="./"|' _site/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
