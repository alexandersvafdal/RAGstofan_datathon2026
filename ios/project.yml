# Xcode project for the RAGstofan iPhone app. Generate the .xcodeproj with:  cd ios && xcodegen
name: RAGstofan
options:
  bundleIdPrefix: com.alexandersvarfdal
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: L76JG6N5NJ          # Alexander Svarfdal Gudmundsson (personal)
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"
targets:
  RAGstofan:
    type: application
    platform: iOS
    sources: [RAGstofan, Shared]
    dependencies:
      - target: RAGstofanWidgets   # the Live Activity, embedded in the app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexandersvarfdal.ragstofan
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: RAGstofan
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    info:
      path: RAGstofan/Info.plist
      properties:
        CFBundleDisplayName: RAGstofan
        UILaunchScreen: {}
        # The written Info.plist wins over INFOPLIST_KEY_ settings, so orientations go here; iPad needs all four
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        # The server is the team's machine, reached over plain HTTP on the local network or through Tailscale (100.x).
        # Only NSAllowsArbitraryLoads: with NSAllowsLocalNetworking beside it iOS ignores it and blocks 100.x addresses.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: RAGstofan connects to the team's statistics server on your local network.
        NSMicrophoneUsageDescription: RAGstofan listens after you tap the microphone button, so you can ask by voice.
        NSSupportsLiveActivities: true

  # Live Activities: each question's progress on the lock screen and in the Dynamic Island
  RAGstofanWidgets:
    type: app-extension
    platform: iOS
    sources: [RAGstofanWidgets, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexandersvarfdal.ragstofan.widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: RAGstofan
        SKIP_INSTALL: YES
    info:
      path: RAGstofanWidgets/Info.plist
      properties:
        CFBundleDisplayName: RAGstofan
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
